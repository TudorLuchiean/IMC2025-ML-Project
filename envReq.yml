name: IMC2025
channels:
  - defaults
dependencies:
  - matplotlib
  - scipy
  - jupyter
  - networkx
  - numpy
  - pillow
  - scikit-learn
  - pandas
  - python=3.12
  - pip
  # torch/torchvision/opencv come from pip: the conda builds link their own glog,
  # which crashes when imported together with pycolmap's bundled glog
  - pip:
      - torch==2.5.1
      - torchvision==0.20.1
      - opencv-python
      - pycolmap
      - kornia
      - h5py
      - kaggle
      - lightglue @ git+https://github.com/cvg/LightGlue.git
      
